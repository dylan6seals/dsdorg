<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dsd.org</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div class="container">
    <header class="main-header">
      <h1 class="site-title">dsd.org</h1>
      <div class="site-meta">
        <span class="last-updated">last updated: <span id="last-update-time">loading...</span></span>
        <span class="divider">|</span>
        <span class="entry-count"><span id="entry-count">0</span> entries</span>
      </div>
    </header>

    <div class="search-section">
      <input 
        type="text" 
        id="search-input" 
        class="search-box" 
        placeholder="search entries..."
        autocomplete="off"
      >
    </div>

    <div class="filter-section">
      <div class="filter-label">filter by:</div>
      <div class="category-filters">
        <button class="filter-btn active" data-category="all">all</button>
        <button class="filter-btn" data-category="text">text</button>
        <button class="filter-btn" data-category="image">image</button>
        <button class="filter-btn" data-category="video">video</button>
        <button class="filter-btn" data-category="audio">audio</button>
        <button class="filter-btn" data-category="mixed">mixed</button>
        <button class="filter-btn" data-category="link">link</button>
        <button class="filter-btn" data-category="code">code</button>
        <button class="filter-btn" data-category="other">other</button>
      </div>
    </div>

    <div class="year-jumps" id="year-jumps">
      <!-- Year links will be inserted here -->
    </div>

    <main class="timeline-section" id="timeline">
      <div class="loading-state">loading entries...</div>
      <!-- Entries will be inserted here -->
    </main>

    <footer class="main-footer">
      <div class="footer-content">
        <a href="/admin" class="admin-link">admin</a>
        <span class="divider">·</span>
        <span class="copyright">© 2026</span>
      </div>
    </footer>
  </div>

  <script src="/js/main.js"></script>
</body>
</html>
